[package]
name = "sash"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
env_logger = "0.11.12"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
x11rb = { version = "0.14.0", features = ["randr", "xinput", "shape"] }
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSBezierPath",
    "NSButton",
    "NSPanel",
    "NSButtonCell",
    "NSTextField",
    "NSText",
    "NSStepper",
    "NSSwitch",
    "NSImageView",
    "NSImageCell",
    "NSAppearance",
    "NSScrollView",
    "NSFont",
    "NSFontDescriptor",
    "NSColorWell",
    "NSColorSpace",
    "NSColorPanel",
    "NSClipView",
    "NSAlert",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "libc",
    "objc2-core-foundation",
    "NSScreen",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "block2",
    "objc2-core-graphics",
    "objc2-quartz-core",
] }
block2 = "0.6.2"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSGeometry", "NSNotification", "NSObject", "NSString"] }
